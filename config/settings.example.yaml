# 平台配置模板（复制为 settings.yaml 后按需修改）

app:
  name: "智能分析平台"
  host: "127.0.0.1"
  port: 8000

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  output_dir: "data/outputs"

storage:
  backend: "local"          # local | minio | postgres
  format: "parquet"

analysis:
  default_engine: "sklearn"  # sklearn | torch
